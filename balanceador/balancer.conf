# Configuracion principal del balanceador Apache. Integrante 1.
# Los BalancerMember se generan al iniciar usando BACKEND_COUNT y BALANCER_METHOD.
# El archivo generado no se edita ni se versiona: balancer-members.conf.

ServerName localhost
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 10

<Proxy "balancer://webcluster">
    Include conf/extra/balancer-members.conf
</Proxy>

# Los endpoints administrativos no se envian a los backends.
# SOLO se pueden consultar desde el propio contenedor; NO se publican a internet.
ProxyPass "/balancer-manager" "!"
ProxyPass "/server-status" "!"

<Location "/balancer-manager">
    SetHandler balancer-manager
    Require local
</Location>
<Location "/server-status">
    SetHandler server-status
    Require local
</Location>

# TODAS las demas peticiones HTTP pasan al pool.
ProxyPass        "/" "balancer://webcluster/"
ProxyPassReverse "/" "balancer://webcluster/"
