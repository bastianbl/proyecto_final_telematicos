# Configuracion principal del balanceador Apache. Integrante 1.
# Los BalancerMember se generan al iniciar usando BACKEND_COUNT y BALANCER_METHOD.
# El archivo generado no se edita ni se versiona: balancer-members.conf.

ServerName localhost
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 10

<Proxy "balancer://webcluster">
    Include conf/extra/balancer-members.conf
</Proxy>

# Los endpoints administrativos no se envian a los backends.
# Antes: "Require local" (solo desde el propio contenedor). El enunciado pide
# capturar estadisticas desde el endpoint de estado, asi que ahora se aceptan:
#  - 127.0.0.1: el propio contenedor (healthcheck de docker-compose.yml);
#  - 172.16.0.0/12: redes de Docker. Las peticiones desde el host por el puerto
#    publicado llegan con la IP de la puerta de enlace de la red de Docker;
#  - 192.168.65.0/24: red interna de Docker Desktop (Windows/macOS).
# NO se abren a otras redes: ademas, el puerto solo se publica en 127.0.0.1 del
# host (docker-compose.yml), asi que nadie de fuera del equipo llega aqui.
# Ojo: balancer-manager tambien permite CAMBIAR el balanceador (deshabilitar
# miembros, cambiar el metodo); cualquiera con acceso a esta IP puede hacerlo.
ExtendedStatus On
ProxyPass "/balancer-manager" "!"
ProxyPass "/server-status" "!"

# Panel administrativo: acceso exclusivo desde el propio contenedor.
# No se permite administrar Apache desde el navegador ni desde otros contenedores.
<Location "/balancer-manager">
    SetHandler balancer-manager
    Require local
</Location>
<Location "/server-status">
    SetHandler server-status
    Require ip 127.0.0.1 172.16.0.0/12 192.168.65.0/24
</Location>

# TODAS las demas peticiones HTTP pasan al pool.
ProxyPass        "/" "balancer://webcluster/"
ProxyPassReverse "/" "balancer://webcluster/"

# Auditoria adicional del reparto (separada del log estandar de Docker).
# %D: duracion en microsegundos; BALANCER_WORKER_NAME: backend seleccionado.
# No se registra el query string para evitar exponer parametros en este log.
LogFormat "%t client=%a method=%m path=%U status=%>s elapsed_us=%D backend=%{BALANCER_WORKER_NAME}e" balanceo_detallado
CustomLog "/usr/local/apache2/logs/balanceo_detallado.log" balanceo_detallado
