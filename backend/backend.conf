# Apache httpd del backend (integrante 2).
# Servidor web del contenedor: escucha en :80 (Listen 80 de httpd.conf) y hace
# proxy inverso a app.py, que solo escucha en 127.0.0.1:8000.

ServerName localhost

# ---- Concurrencia: MPM event ----
# event atiende cada conexion keep-alive inactiva sin ocupar un hilo, asi los
# hilos quedan libres para peticiones reales. Se fijan los valores aqui en vez
# de depender de los defectos compilados.
# Capacidad = ServerLimit x ThreadsPerChild = 8 x 50 = 400 peticiones
# simultaneas por backend. El balanceador (MPM event por defecto, 400 hilos)
# reparte entre 3-7 backends, asi que un backend nunca deberia ser el cuello
# de botella ni encolar peticiones antes de que lleguen a app.py: si las
# encolara, "active" y "peak_active" de /metrics medirian de menos.
<IfModule mpm_event_module>
    StartServers              2
    ServerLimit               8
    ThreadsPerChild          50
    MaxRequestWorkers       400
    MinSpareThreads          50
    MaxSpareThreads         150
    MaxConnectionsPerChild    0
</IfModule>

# Conexiones persistentes con el cliente (el balanceador).
KeepAlive On
MaxKeepAliveRequests 1000
KeepAliveTimeout 5

# docker stop envia SIGWINCH (STOPSIGNAL de la imagen httpd): parada ordenada
# que deja terminar las peticiones en curso, pero como maximo 3 s.
GracefulShutdownTimeout 3

# ---- Proxy inverso hacia app.py ----
ProxyRequests Off

# /work puede tardar WORK_MAX_MS de CPU + WORK_MAX_MS de espera. El entrypoint
# calcula BACKEND_PROXY_TIMEOUT = 2 x WORK_MAX_MS (en s) + 5 de margen;
# con el valor por defecto (10000 ms) da 25 s.
ProxyTimeout ${BACKEND_PROXY_TIMEOUT}

# - retry=0: con un solo destino, el defecto (retry=60) dejaria 60 s devolviendo
#   503 tras un unico fallo transitorio; con 0 se reintenta en la siguiente peticion.
# - Las conexiones hacia app.py se REUTILIZAN (keep-alive, comportamiento por
#   defecto de mod_proxy): no se abre un TCP ni un hilo nuevo en app.py por cada
#   peticion. app.py nunca cierra una conexion inactiva; la cierra Apache tras
#   ttl=30 s. Asi se evita la carrera en la que Apache reutiliza una conexion que
#   el otro extremo acaba de cerrar (que daria un 502).
ProxyPass        "/" "http://127.0.0.1:8000/" connectiontimeout=2 timeout=${BACKEND_PROXY_TIMEOUT} retry=0 ttl=30
ProxyPassReverse "/" "http://127.0.0.1:8000/"
