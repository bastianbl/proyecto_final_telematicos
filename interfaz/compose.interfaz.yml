# MODO DEMOSTRACION de la interfaz (opcional). La interfaz normal ya esta en
# docker-compose.yml (perfil "interfaz") y observa el balanceador principal.
#
# Este archivo AÑADE tres balanceadores de demostracion para cambiar entre
# 3, 5 y 7 backends desde la pagina sin reiniciar nada:
#   docker compose -f docker-compose.yml -f interfaz/compose.interfaz.yml --profile interfaz up -d --build --wait
#   (o: make demo-escenarios)
#
#  - Los 7 backends quedan siempre encendidos (se anulan sus perfiles).
#  - balanceador3/5/7: MISMA imagen del integrante 1 con BACKEND_COUNT fijo.
#  - La pagina muestra los botones "demo 3 / demo 5 / demo 7" ademas de "Principal".
#  - El "balanceador" principal (:8080, scripts y Artillery) no cambia.
# Las rutas son relativas al PRIMER archivo (la raiz).

x-balanceador-demo: &balanceador-demo
  build:
    context: ./balanceador
    dockerfile: Dockerfile
  restart: unless-stopped
  networks:
    - red-proyecto

services:
  # !reset quita los perfiles "cinco"/"siete": los 7 backends arrancan siempre.
  backend4:
    profiles: !reset []
  backend5:
    profiles: !reset []
  backend6:
    profiles: !reset []
  backend7:
    profiles: !reset []

  balanceador3:
    <<: *balanceador-demo
    environment:
      BACKEND_COUNT: "3"
      BALANCER_METHOD: "${BALANCER_METHOD:-byrequests}"
    depends_on:
      backend1: { condition: service_healthy }
      backend2: { condition: service_healthy }
      backend3: { condition: service_healthy }

  balanceador5:
    <<: *balanceador-demo
    environment:
      BACKEND_COUNT: "5"
      BALANCER_METHOD: "${BALANCER_METHOD:-byrequests}"
    depends_on:
      backend1: { condition: service_healthy }
      backend2: { condition: service_healthy }
      backend3: { condition: service_healthy }
      backend4: { condition: service_healthy }
      backend5: { condition: service_healthy }

  balanceador7:
    <<: *balanceador-demo
    environment:
      BACKEND_COUNT: "7"
      BALANCER_METHOD: "${BALANCER_METHOD:-byrequests}"
    depends_on:
      backend1: { condition: service_healthy }
      backend2: { condition: service_healthy }
      backend3: { condition: service_healthy }
      backend4: { condition: service_healthy }
      backend5: { condition: service_healthy }
      backend6: { condition: service_healthy }
      backend7: { condition: service_healthy }

  # Se suma a la definicion de docker-compose.yml: arranca sin perfil, activa
  # los botones de demostracion y espera tambien a los balanceadores demo.
  interfaz:
    profiles: !reset []
    environment:
      PANEL_DEMO: "1"
    depends_on:
      balanceador3: { condition: service_started }
      balanceador5: { condition: service_started }
      balanceador7: { condition: service_started }
