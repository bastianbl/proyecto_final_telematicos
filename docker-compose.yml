name: proyecto-telematicos

x-backend-environment: &backend-environment
  PORT: "80"
  WORK_DELAY_MS: "${WORK_DELAY_MS:-200}"
  WORK_CPU_MS: "${WORK_CPU_MS:-0}"
  WORK_MAX_MS: "${WORK_MAX_MS:-10000}"

x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  # GET /health a traves de Apache (puerto 80) dentro del contenedor:
  # falla si cae Apache o app.py. depends_on: service_healthy lo usa.
  healthcheck:
    test: ["CMD", "python3", "/app/healthcheck.py", "http://127.0.0.1:80/health"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 15s
  networks:
    - red-proyecto

services:
  balanceador:
    build:
      context: ./balanceador
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BALANCER_PORT:-8080}:80"
    # La imagen httpd no trae curl ni wget, pero si bash: se abre una conexion
    # TCP con /dev/tcp y se pide /server-status?auto, que Apache atiende el
    # mismo (no se reenvia a los backends). Exige "HTTP/1.x 200": comprueba que
    # Apache RESPONDE, no solo que el proceso existe.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/80 &&
          printf 'GET /server-status?auto HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment:
      BACKEND_COUNT: "${BACKEND_COUNT:-3}"
      BALANCER_METHOD: "${BALANCER_METHOD:-byrequests}"
      # fijo = backend1..backendN (por defecto); scale = replicas del servicio
      # "backend" creadas con --scale (lo pone "make scale N=...").
      BACKEND_MODE: "${BACKEND_MODE:-fijo}"
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
    # Logs de Apache en el host: balanceo_detallado.log (que backend atendio
    # cada peticion) sobrevive a "docker compose down". El access/error log
    # estandar siguen yendo a "docker compose logs". En esa carpeta Apache
    # tambien deja httpd.pid; si queda uno viejo, Apache solo avisa y lo
    # sobrescribe.
    volumes:
      - ./logs/balanceador:/usr/local/apache2/logs
    networks:
      - red-proyecto

  backend1:
    <<: *backend-common
    environment:
      <<: *backend-environment
      BACKEND_ID: "1"

  backend2:
    <<: *backend-common
    environment:
      <<: *backend-environment
      BACKEND_ID: "2"

  backend3:
    <<: *backend-common
    environment:
      <<: *backend-environment
      BACKEND_ID: "3"

  backend4:
    <<: *backend-common
    profiles: ["cinco", "siete"]
    environment:
      <<: *backend-environment
      BACKEND_ID: "4"

  backend5:
    <<: *backend-common
    profiles: ["cinco", "siete"]
    environment:
      <<: *backend-environment
      BACKEND_ID: "5"

  backend6:
    <<: *backend-common
    profiles: ["siete"]
    environment:
      <<: *backend-environment
      BACKEND_ID: "6"

  backend7:
    <<: *backend-common
    profiles: ["siete"]
    environment:
      <<: *backend-environment
      BACKEND_ID: "7"

  # Modo escalable (opcional, perfil "scale"): un unico servicio con N replicas,
  #   docker compose --profile scale up -d --scale backend=N backend
  # Cada replica deduce su numero de su nombre (proyecto-telematicos-backend-N).
  # El balanceador debe recrearse despues con BACKEND_MODE=scale y
  # BACKEND_COUNT=N para tener un BalancerMember por replica: "make scale N=...".
  backend:
    <<: *backend-common
    profiles: ["scale"]
    environment:
      <<: *backend-environment

  # Interfaz grafica (perfil "interfaz"): http://localhost:8090. Observa el
  # MISMO balanceador que Artillery y los scripts; muestra el reparto, el
  # estado de cada backend, /server-status y los resultados de las pruebas.
  # "make up" la incluye; en PowerShell:
  #   docker compose --profile interfaz up -d --build interfaz
  interfaz:
    build:
      context: ./interfaz
      dockerfile: Dockerfile
    profiles: ["interfaz"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PANEL_PORT:-8090}:80"
    environment:
      BACKEND_COUNT: "${BACKEND_COUNT:-3}"
      BALANCER_METHOD: "${BALANCER_METHOD:-byrequests}"
      PANEL_DEMO: "0"
    # nginx:alpine trae wget (busybox). /panel-config.json lo genera el propio
    # nginx desde la plantilla: si responde, nginx esta arriba y su
    # configuracion se cargo bien. Mismo criterio que el HEALTHCHECK del
    # Dockerfile, pero declarado en el compose como pide el enunciado.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/panel-config.json || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 3s
    # Resultados y metricas, SOLO LECTURA: la interfaz no puede modificarlos.
    volumes:
      - ./metricas:/usr/share/nginx/html/datos/metricas:ro
      - ./pruebas/resultados:/usr/share/nginx/html/datos/resultados:ro
    depends_on:
      balanceador:
        condition: service_healthy
    networks:
      - red-proyecto

  # Servicio de ejecucion puntual: arranca, lanza la prueba y termina.
  # Imagen propia con version fija de Artillery: pruebas/Dockerfile.
  artillery:
    build:
      context: ./pruebas
      dockerfile: Dockerfile
    profiles: ["artillery"]
    command:
      - run
      - /tests/artillery-smoke.yml
      - --output
      - /results/artillery-report.json
    # Comprueba que el binario de Artillery funciona dentro del contenedor.
    # Solo tiene efecto mientras la prueba esta en marcha (ver README).
    healthcheck:
      test: ["CMD-SHELL", "/home/node/artillery/bin/run version > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      balanceador:
        condition: service_healthy
    networks:
      - red-proyecto
    volumes:
      - ./pruebas:/tests:ro
      - ./pruebas/resultados:/results

networks:
  red-proyecto:
    driver: bridge
